<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CardMaster — Best card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F13}
a{color:#B7ACFF}a:hover{color:#D4CCFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0F13; color: #F2F3F7; font-family: Manrope, system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <div style="display: flex; flex-direction: column; gap: 16px; padding: 24px 24px 100px 24px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 13px; color: #9AA0B4">Before you pay</div>
      <h1 style="margin: 0; font-size: 24px; font-weight: 800">Which card should I use?</h1>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
        <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; gap: 10px; align-items: stretch">
      <div style="flex: 1; padding: 10px 14px; border-radius: 14px; background: #171922; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 11px; color: #9AA0B4">Amount</div>
        <div style="font-size: 22px; font-weight: 800">₹{{amountText}}</div>
      </div>
      <button type="button" onClick="{{toggleUpi}}" aria-pressed="{{upiPressed}}" style="{{upiStyle}}">
        <div style="font-size: 11px; color: #9AA0B4">Paying via</div>
        <div style="font-size: 15px; font-weight: 800">{{upiLabel}}</div>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; color: #9AA0B4; text-transform: uppercase; letter-spacing: 1px">Ranked for you</div>
      <sc-for list="{{results}}" as="r" hint-placeholder-count="3">
        <div style="{{r.rowStyle}}">
          <div style="width: 26px; font-size: 15px; font-weight: 800; color: #9AA0B4">{{r.rank}}</div>
          <div style="width: 46px; height: 30px; border-radius: 6px; background: {{r.face}}; flex-shrink: 0"></div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <div style="font-size: 14px; font-weight: 700">{{r.name}}</div>
            <div style="font-size: 12px; color: #C9CDD9">{{r.reason}}</div>
            <sc-if value="{{r.hasWarn}}" hint-placeholder-val="{{ false }}">
              <div style="font-size: 12px; color: #F5B54A">{{r.warn}}</div>
            </sc-if>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
            <div style="{{r.valueStyle}}">{{r.value}}</div>
            <div style="font-size: 11px; color: #9AA0B4">{{r.pct}}</div>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="font-size: 12px; color: #9AA0B4">Sample rates and caps. Uses what you've already spent this month.</div>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #14161D; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 8px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA0B4; text-decoration: none; font-size: 11px; font-weight: 600">
      <div style="padding: 4px 18px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"></path><path d="M3 7V6a2 2 0 0 1 2-2h11"></path><circle cx="16.5" cy="13.5" r="1.2"></circle></svg></div>
      Wallet
    </a>
    <a href="BestCard.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #F2F3F7; text-decoration: none; font-size: 11px; font-weight: 700">
      <div style="padding: 4px 18px; border-radius: 14px; background: #2A2550; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6L20 9.5l-4 4 1 5.8L12 16.6 7 19.3l1-5.8-4-4 5.4-.9z"></path></svg></div>
      Best card
    </a>
    <a href="Activity.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA0B4; text-decoration: none; font-size: 11px; font-weight: 600">
      <div style="padding: 4px 18px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg></div>
      Money
    </a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA0B4; text-decoration: none; font-size: 11px; font-weight: 600">
      <div style="padding: 4px 18px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></div>
      Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"amount":{"editor":"int","default":2400,"min":100,"max":200000,"step":100},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'utilities', upi: false };
  }
  renderVals() {
    const amount = this.props.amount ?? 2400;
    const cat = this.state.cat;
    const upi = this.state.upi;
    const catList = [
      ['utilities', 'Utilities'], ['airtel', 'Airtel bill'], ['food', 'Food delivery'],
      ['foreign', 'Foreign'], ['shopping', 'Shopping'], ['fuel', 'Fuel']
    ];
    const cats = catList.map(([id, label]) => ({
      label,
      pressed: id === cat ? 'true' : 'false',
      pick: () => this.setState({ cat: id }),
      style: 'height: 44px; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; ' +
        (id === cat ? 'background: #2A2550; color: #FFFFFF; border: 1.5px solid #8B7CF6' : 'background: #171922; color: #C9CDD9; border: 1.5px solid #171922')
    }));
    // Sample data: rate %, monthly cap left (₹), forex markup %, network
    const cards = [
      { name: 'Airtel Axis', face: 'linear-gradient(135deg,#6E0D27,#B3123B)', network: 'MASTERCARD', markup: 3.5,
        rates: { utilities: [10, 130, 'via Airtel Thanks'], airtel: [25, 0, 'via Airtel Thanks'], food: [10, 190, 'Swiggy / Zomato'], foreign: [1, null, ''], shopping: [1, null, ''], fuel: [0, null, 'fuel excluded'] } },
      { name: 'Scapia Federal', face: 'linear-gradient(135deg,#0F3D3E,#1C6E62)', network: 'VISA', markup: 0,
        rates: { utilities: [0, null, 'utilities excluded'], airtel: [0, null, 'bills excluded'], food: [2, null, ''], foreign: [2, null, 'zero forex markup'], shopping: [2, null, ''], fuel: [0, null, 'fuel excluded'] } },
      { name: 'Tata Neu HDFC', face: 'linear-gradient(135deg,#2B1055,#5B2A86)', network: 'RUPAY', markup: 2,
        rates: { utilities: [1.5, null, ''], airtel: [1.5, null, ''], food: [1.5, null, ''], foreign: [1.5, null, ''], shopping: [1.5, null, ''], fuel: [1, null, ''] } }
    ];
    const fmt = (n) => Math.round(n).toLocaleString('en-IN');
    const rows = cards.map((c) => {
      const [rate, capLeft, note] = c.rates[cat];
      if (upi && c.network !== 'RUPAY') {
        return { c, net: -Infinity, eligible: false, reason: c.network + ' — not usable on UPI', warn: 'Only RuPay credit cards work on UPI' };
      }
      let reward = amount * rate / 100;
      let warn = '';
      if (capLeft !== null && reward > capLeft) {
        reward = capLeft;
        warn = capLeft === 0 ? 'Monthly cap already used up' : 'Capped at ₹' + fmt(capLeft) + ' left this month';
      }
      let net = reward;
      let reason = rate + '% back' + (note ? ' · ' + note : '');
      if (cat === 'foreign') {
        const fee = amount * c.markup / 100;
        net = reward - fee;
        reason = rate + '% back − ' + c.markup + '% forex markup';
      }
      if (rate === 0) warn = warn || 'Earns nothing on this category';
      return { c, net, eligible: true, reason, warn };
    });
    rows.sort((a, b) => b.net - a.net);
    const results = rows.map((r, i) => ({
      rank: r.eligible ? String(i + 1) : '–',
      name: r.c.name,
      face: r.c.face,
      reason: r.reason,
      warn: r.warn,
      hasWarn: !!r.warn,
      value: r.eligible ? (r.net < 0 ? '−₹' + fmt(-r.net) : '₹' + fmt(r.net)) : 'N/A',
      pct: r.eligible ? (r.net / amount * 100).toFixed(1) + '%' : 'ineligible',
      valueStyle: 'font-size: 18px; font-weight: 800; color: ' + (!r.eligible ? '#6B7083' : r.net > 0 ? '#3DD68C' : r.net < 0 ? '#FF8A8A' : '#C9CDD9'),
      rowStyle: 'display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 16px; ' +
        (i === 0 && r.eligible ? 'background: #15261E; border: 1.5px solid #2F7A55' : 'background: #171922; border: 1.5px solid #171922') +
        (r.eligible ? '' : '; opacity: 0.7')
    }));
    return {
      cats, results,
      amountText: fmt(amount),
      upiLabel: upi ? 'UPI' : 'Card',
      upiPressed: upi ? 'true' : 'false',
      toggleUpi: () => this.setState({ upi: !this.state.upi }),
      upiStyle: 'width: 120px; padding: 10px 14px; border-radius: 14px; font: inherit; color: #F2F3F7; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; ' +
        (upi ? 'background: #2A2550; border: 1.5px solid #8B7CF6' : 'background: #171922; border: 1.5px solid #171922')
    };
  }
}
</script>
</body>
</html>
