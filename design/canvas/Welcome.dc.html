<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card Master — Before you start</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Unbounded:wght@500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F13}
a{color:#B7ACFF}a:hover{color:#D4CCFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0F13; color: #F2F3F7; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 28px 32px 28px; box-sizing: border-box; gap: 24px">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="font-family: Unbounded, sans-serif; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 10px; font-weight: 500; letter-spacing: 8px; color: #9AA0B4">CARD</span>
      <span style="font-size: 20px; font-weight: 800; line-height: 1">MASTER<span style="color: #F5B54A">.</span></span>
    </div>
    <div style="font-size: 12px; font-weight: 700; color: #9AA0B4">{{stepText}}</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; flex: 1; justify-content: center">
    <div style="width: 72px; height: 72px; border-radius: 22px; background: {{iconBg}}; color: {{iconFg}}; display: flex; align-items: center; justify-content: center">
      <sc-if value="{{isStep1}}" hint-placeholder-val="{{ true }}">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
      </sc-if>
      <sc-if value="{{isStep2}}" hint-placeholder-val="{{ false }}">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18M12 3v18"></path><circle cx="12" cy="12" r="9"></circle></svg>
      </sc-if>
      <sc-if value="{{isStep3}}" hint-placeholder-val="{{ false }}">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"></path><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path></svg>
      </sc-if>
    </div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; line-height: 1.2; letter-spacing: -0.5px">{{title}}</h1>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{points}}" as="p" hint-placeholder-count="3">
        <div style="display: flex; gap: 12px; align-items: flex-start">
          <div style="width: 6px; height: 6px; border-radius: 3px; background: {{iconFg}}; margin-top: 8px; flex-shrink: 0"></div>
          <div style="font-size: 15px; color: #C9CDD9; line-height: 1.5">{{p.text}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; gap: 6px; justify-content: center" aria-hidden="true">
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
      <div style="{{d.style}}"></div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <button type="button" onClick="{{next}}" style="height: 54px; border-radius: 16px; border: 0; background: #6A5AE0; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">{{cta}}</button>
    <a href="Trust.dc.html" style="text-align: center; font-size: 13px; font-weight: 700; padding: 10px">Read the full details in the Trust Center</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0 };
  }
  renderVals() {
    const steps = [
      { title: 'Your data stays on this phone.', bg: '#15261E', fg: '#3DD68C', cta: 'Next',
        points: ['No account to create. No ads. No tracking.', 'We have no server that stores anything about you, so there’s nothing of yours for us to sell or lose.', 'We only ask for the last 4 digits of a card, never the full number or CVV.'] },
      { title: 'Honest trade-offs.', bg: '#3A3320', fg: '#F5B54A', cta: 'Next',
        points: ['We don’t read your SMS. You share or copy bank messages in a few taps.', 'We don’t sync to the cloud. This phone holds the only copy.', 'The app goes online only to download card-benefit updates. Nothing is ever uploaded.'] },
      { title: 'Keep a backup. Seriously.', bg: '#1F1B3A', fg: '#B7ACFF', cta: 'Choose backup folder',
        points: ['If you lose your phone without a backup, your data is gone. We can’t recover it, because we never had it.', 'Pick a folder once and we’ll save an encrypted backup there every week.', 'Moving to a new phone? Your backup file is the way.'] }
    ];
    const i = this.state.step;
    const s = steps[i];
    return {
      title: s.title,
      points: s.points.map((text) => ({ text })),
      iconBg: s.bg, iconFg: s.fg, cta: s.cta,
      isStep1: i === 0, isStep2: i === 1, isStep3: i === 2,
      stepText: (i + 1) + ' of 3',
      dots: steps.map((_, n) => ({ style: 'height: 6px; border-radius: 3px; ' + (n === i ? 'width: 18px; background: #F2F3F7' : 'width: 6px; background: #4A4E60') })),
      next: () => this.setState({ step: (i + 1) % 3 })
    };
  }
}
</script>
</body>
</html>
