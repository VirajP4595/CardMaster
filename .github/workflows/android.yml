name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Disable Flutter analytics
        run: flutter --disable-analytics

      - name: Get packages
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      # Optional: your own signing key (repo secrets ANDROID_KEYSTORE_BASE64
      # and ANDROID_KEYSTORE_PASSWORD). Keeps one key across builds so each
      # new APK installs over the last one without losing data.
      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "SIGNED=debug" >> "$GITHUB_ENV"
            echo "::warning::No signing key secret: APK signed with a throwaway debug key"
          fi

      - name: Build APK
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi \
            --build-name=1.0.0 --build-number=${{ github.run_number }} 2>&1 | tee build.log

      # Surfaces the build error as an annotation, readable without the
      # full log (handy where log downloads are blocked).
      - name: Report build error
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          msg=$(grep -n -iE -A6 "what went wrong|error:|exception|failed" build.log | head -60)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Build APK failed::$msg"

      # Release blocker check (docs/04-BUILD-GUIDE.md §6, rule R7): the merged
      # manifest may only contain these permissions.
      - name: Check permissions
        run: |
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          echo "::notice title=APK permissions::$(grep 'uses-permission:' permissions.txt | sed "s/uses-permission: name='//; s/'.*//" | paste -sd ' ' -)"
          ALLOWED='INTERNET|USE_BIOMETRIC|USE_FINGERPRINT|POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'
          if grep "uses-permission:" permissions.txt | grep -vE "$ALLOWED"; then
            echo "::error::Unapproved permission found (see list above)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: card-master-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Name APKs for download
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/card-master-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/card-master-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/card-master-x86_64.apk

      # Direct-download release for testing on a phone.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: Card Master 1.0.0 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            Test build from `${{ github.ref_name }}` (${{ github.sha }}).

            **Install:** download `card-master-arm64.apk` (almost every phone from the last 6 years), open it, and allow installing from your browser/files app when Android asks.

            Signing: `${{ env.SIGNED }}` key. ${{ env.SIGNED == 'debug' && 'Signed with a throwaway key: to install a newer build, uninstall the old one first (this deletes the app data, so export a backup first).' || 'Signed with the project key: newer builds install over this one and keep your data.' }}

            Benefit rates are sample data until verified. Not a Play Store build.
