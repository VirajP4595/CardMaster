name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Disable Flutter analytics
        run: flutter --disable-analytics

      - name: Get packages
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build.log

      # Surfaces the build error as an annotation, readable without the
      # full log (handy where log downloads are blocked).
      - name: Report build error
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          msg=$(grep -n -iE -A6 "what went wrong|error:|exception|failed" build.log | head -60)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Build APK failed::$msg"

      # Release blocker check (docs/04-BUILD-GUIDE.md §6, rule R7): the merged
      # manifest may only contain these permissions.
      - name: Check permissions
        run: |
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          echo "::notice title=APK permissions::$(grep 'uses-permission:' permissions.txt | sed "s/uses-permission: name='//; s/'.*//" | paste -sd ' ' -)"
          ALLOWED='INTERNET|USE_BIOMETRIC|USE_FINGERPRINT|DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'
          if grep "uses-permission:" permissions.txt | grep -vE "$ALLOWED"; then
            echo "::error::Unapproved permission found (see list above)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: card-master-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
